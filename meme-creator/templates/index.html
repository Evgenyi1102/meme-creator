<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Генератор мемов</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="50" height="50">
    <ul class="main-list">
        <li class="list__item">
          <a href="">Главная</a>
        </li>
        <li class="list__item">
          <a href="">Коллекция</a>
        </li>
        <li class="list__item">
          <a href="">Связь</a>
        </li>
    </ul>
  </header>
  <main>
    <div class="form-block">
      <h1>Сгенерируй свой мем!</h1>

      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Загрузить на сайт</button>
      </form>

      <form method="POST" action="{{ url_for('index') }}">
        <ul class="form-list">
          <li class="form-list_item">
            <label for="image-selector">Выбери мем</label>
            <select name="image-selector" id="image-selector">
              {% for img in images %}
              <option value="{{ img }}" {% if selected_image == img %}selected{% endif %}>{{ img }}</option>
              {% endfor %}
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop">Введите текст сверху</label>
            <input class="input_text" type="text" placeholder="Введите текст" name="textTop" value="{{ text_top or '' }}">
          </li>
          <li class="form-list_item">
            <label for="textBottom">Введите текст снизу</label>
            <input class="input_text" type="text" placeholder="Введите текст" name="textBottom" value="{{ text_bottom or '' }}">
          </li>
          <li class="form-list_item">
            <label for="color-selector">Цвет текста</label>
            <select name="color-selector" id="color-selector">
              <option value="white" {% if selected_color == 'white' %}selected{% endif %}>Белый</option>
              <option value="black" {% if selected_color == 'black' %}selected{% endif %}>Черный</option>
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop_y">Введите расположение вверхнего текста по Y</label>
            <input class="input_text" id="textTop_y" type="text" placeholder="Введите текст" name="textTop_y" value="{{ text_top_y or '' }}">
          </li>
          <li class="form-list_item">
            <label for="textBottom_y">Введите расположение нижнего текста по Y</label>
            <input class="input_text" id="textBottom_y" type="text" placeholder="Введите текст" name="textBottom_y" value="{{ text_bottom_y or '' }}">
          </li>
          <button type="submit">Выбрать</button>
          <a class="download-btn" href="{{ url_for('downloadFile', filename=selected_image) }}">скачать мем</a>
        </ul>
      </form>
    </div>

    <div class="meme-block" id="memeBlock">
      <p class="text_top" style="color: {{selected_color}}; top: {{text_top_y or 0}}px">
        {{text_top}}
      </p>

      <img class="meme" src="{{ url_for('static', filename='img/' ~ selected_image) }}" alt="{{ selected_image }}">

      <p class="text_bottom" style="color: {{selected_color}}; bottom: {{text_bottom_y or 0}}px">
        {{text_bottom}}
      </p>
    </div>
  </main>
  <footer>

  </footer>
</body>
</html>
